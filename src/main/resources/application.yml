server:
  port: 9900
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

file:
  upload:
    path: ./uploads
    allowed-extensions: txt,md

milvus:
  host: localhost
  port: 19530
  username: ""
  password: ""
  database: default
  timeout: 10000

# Spring AI Alibaba DashScope 配置
spring:
  profiles:
    active: local
  ai:
    model:
      chat: deepseek
      embedding: dashscope
    deepseek:
      # 项目专用变量名，避免与本机其它工具的 DEEPSEEK_API_KEY 互相覆盖
      api-key: ${DEEPSEEK_API_KEY_AGENT}
      chat:
        options:
          model: deepseek-chat
          temperature: 0.3
#    dashscope:
#      api-key: ${DASHSCOPE_API_KEY}
#      chat:
#        options:
#          timeout: 180000  # 超时时间180秒（3分钟）
#      retry:
#        max-attempts: 3  # 最大重试次数
#        backoff:
#          initial-interval: 2000  # 初始重试间隔2秒
#          multiplier: 2  # 重试间隔倍数
#          max-interval: 10000  # 最大重试间隔10秒
    
    # Spring AI MCP 客户端
    # 默认关闭：MCP Server 不可用时，客户端会在启动阶段报
    # 「Client failed to initialize by explicit API call」并让整个应用起不来。
    # 需要远程工具时先启动 mcp-server/mcp_sse_server.py，再用 mcp profile 启动应用：
    #   --spring.profiles.active=local,mcp
    mcp:
      client:
        enabled: false
        name: biz-mcp-client
        version: 1.0.0
        request-timeout: 60s
        type: ASYNC

# 阿里云 DashScope Embedding API 配置
dashscope:
  api:
    key: ${DASHSCOPE_API_KEY}
  embedding:
    model: text-embedding-v4  # 阿里云文本向量化模型

# 文档分片配置
document:
  chunk:
    max-size: 800  # 每个分片最大字符数
    overlap: 100   # 分片之间的重叠字符数

# RAG 配置
rag:
  top-k: 3  # 检索返回的最相似文档数量
  model: "qwen3-max"  # 大语言模型名称

# Prometheus 配置
prometheus:
  base-url: http://localhost:9090
  timeout: 10  # 超时时间（秒）
  mock-enabled: true  # 本地学习阶段使用内置模拟告警

# CLS 云日志服务配置
cls:
  mock-enabled: true  # 本地学习阶段使用内置模拟日志

# 离线评测配置
eval:
  trace:
    output-dir: ./eval-reports  # 每次运行的 trace 与批量汇总落盘目录
  # 价目表：请求的模型别名是 deepseek-chat，实际落到 deepseek-flash（见 trace 里的 usage.model）
  # 空闲时段 = 输入 1 元/M、输出 4 元/M；高峰时段 = 输入 2 元/M、输出 8 元/M（元/百万 tokens）
  # 默认按「高峰时段」计，属于成本上限估计；若确认跑在空闲时段，改回 1.0 / 4.0 即可
  pricing:
    prompt-cny-per-million: 2.0
    completion-cny-per-million: 8.0
    # 缓存命中的输入单价。当前实现不区分缓存命中，一律按未命中（较高价）计算，
    # 因此成本是保守（偏上限）估计。此值仅作为价目记录保留：
    # 空闲时段为 0.02、高峰时段为 0.04，此处取高峰档
    prompt-cache-hit-cny-per-million: 0.04
    currency: CNY
    source: "DeepSeek deepseek-flash 价目表（高峰时段），缓存命中未单独建模"
  runner:
    base-url: http://localhost:9900   # 批量评测驱动进程访问的服务地址
    timeout-seconds: 600              # 单个场景的最长等待时间

---
# 启用 MCP 远程工具通道。
# 使用前提：先启动仓库自带的示例 Server（见 mcp-server/README.md）。
#   python mcp-server/mcp_sse_server.py --port 8081
# 然后带上 mcp profile 启动应用：
#   --spring.profiles.active=local,mcp
# 接真实云上 MCP 时，把 url / sse-endpoint 换成云服务提供的地址即可。
spring:
  config:
    activate:
      on-profile: mcp
  ai:
    mcp:
      client:
        enabled: true
        sse:
          connections:
            biz-logs:
              url: http://127.0.0.1:8081
              sse-endpoint: /sse
